const copy=b=>b.map(x=>[...x]);
const won=b=>b.every(x=>!x.length||(x.length===4&&x.every(c=>c===x[0])));
function pour(board,from,to){
 if(from===to||!board[from]?.length||!board[to]||board[to].length===4)return null;
 const a=board[from],b=board[to],c=a.at(-1);if(b.length&&b.at(-1)!==c)return null;
 let run=0;for(let i=a.length-1;i>=0&&a[i]===c;i--)run++;
 const n=Math.min(run,4-b.length),next=copy(board);next[from].splice(-n);next[to].push(...Array(n).fill(c));return next;
}
function rng(seed){return()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};}
function level(index){
 const random=rng(795+index*1337),colors=Math.min(6,2+Math.floor(index/4));
 let board=Array.from({length:colors},(_,i)=>Array(4).fill(i));board.push([],[]);let reverse=[];
 for(let step=0;step<45+index*7;step++){
  const options=[];
  board.forEach((a,i)=>{if(!a.length)return;let run=0;for(let k=a.length-1;k>=0&&a[k]===a.at(-1);k--)run++;
   board.forEach((b,j)=>{if(i===j||b.length===4||(b.length&&b.at(-1)===a.at(-1)))return;
    for(let n=1;n<=Math.min(run,4-b.length);n++)if(a.length===n||a[a.length-n-1]===a.at(-1))options.push([i,j,n]);
   });});
  if(!options.length)break;
  const [i,j,n]=options[Math.floor(random()*options.length)];board[j].push(...board[i].splice(-n));reverse.unshift([j,i]);
 }
 return {board,solution:reverse,colors};
}
function solve(start,limit=150000){
 const visited=new Set();let nodes=0;
 function dfs(b,path){if(won(b))return path;if(++nodes>limit)return null;
  const key=b.map(x=>x.join('')).sort().join('|');if(visited.has(key))return null;visited.add(key);
  const moves=[];
  for(let i=0;i<b.length;i++){const a=b[i];if(!a.length||a.length===4&&a.every(x=>x===a[0]))continue;let empty=false;
   for(let j=0;j<b.length;j++){if(i===j)continue;const dest=b[j];if(!dest.length){if(empty||a.every(x=>x===a[0]))continue;empty=true;}
    const next=pour(b,i,j);if(next)moves.push({i,j,next,rank:dest.length?10+dest.length:0});
   }}
  moves.sort((a,b)=>b.rank-a.rank);
  for(const m of moves){const result=dfs(m.next,[...path,[m.i,m.j]]);if(result)return result;if(nodes>limit)return null;}
  return null;
 }
 return dfs(start,[]);
}

 layout(){const n=this.board.length,cols=n<=4?n:n<=6?3:4,rows=Math.ceil(n/cols);this.bw=Math.min(58,(this.w-38)/(cols*1.7));this.bh=rows>1?Math.min(139,this.h*.34):Math.min(205,this.h*.52);this.slots=this.board.map((_,i)=>{const row=Math.floor(i/cols),rowCount=Math.min(cols,n-row*cols),gap=this.bw*1.65;return {x:this.w/2+(i%cols-(rowCount-1)/2)*gap,y:rows===1?this.h*.55:94+row*(this.bh+50),w:this.bw,h:this.bh};});this.targets.innerHTML=this.slots.map((p,i)=>`<button data-i="${i}" aria-label="Колба ${i+1}" style="left:${p.x-p.w*.65}px;top:${p.y-p.h/2-18}px;width:${p.w*1.3}px;height:${p.h+42}px"></button>`).join('');this.targets.querySelectorAll('button').forEach(b=>b.onclick=()=>this.onSelect(+b.dataset.i));}
 update(board,selected=-1,hint=[]){this.board=board.map(x=>[...x]);this.selected=selected;this.hint=hint;if(this.slots?.length!==board.length)this.layout();this.targets.querySelectorAll('button').forEach((b,i)=>{b.setAttribute('aria-label',`Колба ${i+1}, ${board[i].length} слоя`);b.setAttribute('aria-pressed',String(i===selected));});}
 animatePour(from,to,next,reduced){if(reduced){this.update(next);return Promise.resolve();}return new Promise(resolve=>{this.motion={from,to,next,original:this.board.map(x=>[...x]),n:next[to].length-this.board[to].length,start:performance.now(),duration:1600,resolve};});}
 loop(now){if(!this.active)return;this.draw(now);this.frame=requestAnimationFrame(this.loop);}
 draw(now){const c=this.ctx;c.clearRect(0,0,this.w,this.h);if(!this.slots)return;
 const m=this.motion,t=m?Math.min(1,(now-m.start)/m.duration):0;
 const transfer=m?ease(Math.max(0,Math.min(1,(t-.28)/.43))):0;
 const source=m?this.slots[m.from]:null,dest=m?this.slots[m.to]:null;
 const poses=this.slots.map((p,i)=>({...p,a:0,y:p.y-(i===this.selected?15:0)}));
 if(m){const s=source,d=dest,sign=d.x>=s.x?1:-1,angle=sign*(67+transfer*22)*Math.PI/180;const lx=sign*s.w*.34,ly=-s.h/2+8;
  const target={x:d.x-(lx*Math.cos(angle)-ly*Math.sin(angle)),y:d.y-d.h/2-28-(lx*Math.sin(angle)+ly*Math.cos(angle))};
  const go=t<.28?ease(t/.28):t>.76?1-ease((t-.76)/.24):1;
  poses[m.from]={...s,x:mix(s.x,target.x,go),y:mix(s.y,target.y,go)-Math.sin(go*Math.PI)*22,a:angle*go};
 }
 const drawOne=i=>{let layers=this.board[i].map(color=>({color,amount:1}));if(m&&i===m.from){let remaining=m.n*transfer;for(let j=layers.length-1;j>=0&&remaining>0;j--){let n=Math.min(remaining,layers[j].amount);layers[j].amount-=n;remaining-=n;}}if(m&&i===m.to)layers.push({color:m.original[m.from].at(-1),amount:m.n*transfer});this.bottle(poses[i],layers,i,now);};
 for(let i=0;i<this.board.length;i++)if(!m||i!==m.from)drawOne(i);
 if(m){drawOne(m.from);if(t>.28&&t<.73){const p=poses[m.from],sign=dest.x>=source.x?1:-1,lip=rotate([sign*p.w*.34,-p.h/2+8],p.x,p.y,p.a);const end=[dest.x,dest.y+dest.h*.35-(m.original[m.to].length+m.n*transfer)*dest.h*.205];c.save();c.strokeStyle=COLORS[m.original[m.from].at(-1)];c.lineWidth=5;c.lineCap='round';c.shadowColor=c.strokeStyle;c.shadowBlur=8;c.beginPath();c.moveTo(...lip);c.bezierCurveTo(lip[0]+2,lip[1]+20,end[0],end[1]-20,...end);c.stroke();c.lineWidth=1.2;c.strokeStyle='#ffffff99';c.stroke();c.restore();for(let k=0;k<5;k++){const q=(now/150+k*.2)%1;c.fillStyle=COLORS[m.original[m.from].at(-1)]+'bb';c.beginPath();c.arc(end[0]+Math.sin(k*2.5)*q*12,end[1]-Math.sin(q*Math.PI)*13,1.5*(1-q),0,Math.PI*2);c.fill();}}if(t===1){this.board=m.next.map(x=>[...x]);this.motion=null;m.resolve();}}
 }
 bottle(p,layers,index,now){const c=this.ctx,{x,y,w,h,a}=p;const r=w*.35,top=-h/2+11,bottom=h/2-8;let inner=[[-r,top],[r,top],[r,bottom-r]];for(let i=0;i<=16;i++){const angle=i*Math.PI/16;inner.push([Math.cos(angle)*r,bottom-r+Math.sin(angle)*r]);}inner.push([-r,top]);const poly=inner.map(q=>rotate(q,x,y,a));
 c.save();c.translate(x,this.slots[index].y+h/2+12);c.scale(1,.16);const shadow=c.createRadialGradient(0,0,0,0,0,w*.8);shadow.addColorStop(0,'#00151b88');shadow.addColorStop(1,'#00151b00');c.fillStyle=shadow;c.beginPath();c.arc(0,0,w*.8,0,Math.PI*2);c.fill();c.restore();
 c.save();path(c,poly);c.clip();const base=c.createLinearGradient(x-w/2,0,x+w/2,0);base.addColorStop(0,'#9adbd214');base.addColorStop(.45,'#183d421a');base.addColorStop(1,'#a9e6e126');c.fillStyle=base;c.fillRect(x-h-w,y-h,h*2+w*2,h*3);
 let amount=0;for(const l of layers){if(l.amount<.001)continue;const low=surface(poly,amount/4),high=surface(poly,(amount+l.amount)/4);c.fillStyle=COLORS[l.color];c.fillRect(x-h-w,high,h*2+w*2,low-high+1);const shine=c.createLinearGradient(x-w/2,0,x+w/2,0);shine.addColorStop(0,'#ffffff55');shine.addColorStop(.25,'#ffffff08');shine.addColorStop(.8,'#00000015');shine.addColorStop(1,'#00000044');c.fillStyle=shine;c.fillRect(x-h-w,high,h*2+w*2,low-high+1);c.fillStyle='#ffffff4a';c.fillRect(x-h-w,high,h*2+w*2,1.4);amount+=l.amount;}c.restore();
 c.save();c.translate(x,y);c.rotate(a);if(index===this.selected||this.hint.includes(index)){c.shadowColor=this.hint.includes(index)?'#e7ce80':'#c0ebba';c.shadowBlur=15;}c.strokeStyle='#b7d9d4aa';c.lineWidth=2.2;c.beginPath();c.moveTo(-w*.43,-h/2+3);c.lineTo(-w*.43,h/2-w*.43);c.quadraticCurveTo(-w*.43,h/2,0,h/2);c.quadraticCurveTo(w*.43,h/2,w*.43,h/2-w*.43);c.lineTo(w*.43,-h/2+3);c.stroke();c.shadowBlur=0;c.strokeStyle='#d9f6ebbb';c.lineWidth=3;c.beginPath();c.ellipse(0,-h/2+5,w*.47,4,0,0,Math.PI*2);c.stroke();c.strokeStyle='#e4fff055';c.lineWidth=2;c.beginPath();c.moveTo(-w*.29,-h/2+17);c.lineTo(-w*.29,h*.29);c.stroke();for(let j=0;j<3;j++){c.strokeStyle='#d6e8df44';c.lineWidth=1;c.beginPath();c.moveTo(w*.23,h*.25-j*h*.2);c.lineTo(w*.34,h*.25-j*h*.2);c.stroke();}c.restore();
 c.fillStyle='#98b8b0';c.font='9px Manrope, sans-serif';c.textAlign='center';c.fillText(String(index+1).padStart(2,'0'),this.slots[index].x,this.slots[index].y+h/2+32);
 if(!this.motion&&layers.length===4&&layers.every(l=>l.color===layers[0].color)){c.fillStyle='#c9e6a5';c.font='15px sans-serif';c.fillText('✓',x,y-h/2-14);}
 }
}

const app=document.querySelector('#app');
const KEY='aurora-prototype-v2';
const moveWord=n=>n%10===1&&n%100!==11?'ход':n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?'хода':'ходов';
let state={done:Array(10).fill(false),best:Array(10).fill(0),energy:0,upgrades:[],sound:true,music:false,reduced:matchMedia('(prefers-reduced-motion:reduce)').matches};
function validate(s){return s&&Array.isArray(s.done)&&s.done.length===10&&Array.isArray(s.best)&&s.best.length===10&&Number.isFinite(s.energy)&&s.energy>=0&&Array.isArray(s.upgrades)&&s.upgrades.every(x=>upgrades.some(u=>u.id===x));}
try{const x=JSON.parse(localStorage.getItem(KEY));if(validate(x))state={...state,...x};}catch{}
let scene='lab',board=[],history=[],selected=-1,index=0,moves=0,busy=false,renderer=null,lastReward=false,extra=false,hint=[],generation=0,modal=false,tab='upgrades';
const isSpline=!!window.spline;document.body.classList.toggle('spline',isSpline);
let bridgeReady=false,objectIds={},baseObjects={},nativeReady=false;
const music=new Audio(AUDIO.music);music.loop=true;music.volume=.14;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{}if(window.top!==window)window.top.postMessage({type:'aurora-save',state},'*');}
window.addEventListener('message',e=>{if(e.source!==window.top||e.data?.type!=='aurora-state'||!validate(e.data.state)||nativeReady)return;state={...state,...e.data.state};nativeReady=true;render();syncLab();});
if(window.top!==window)window.top.postMessage({type:'aurora-load'},'*');
function sound(name){if(!state.sound)return;const a=new Audio(AUDIO[name]);a.volume=name==='pour'?.28:.4;a.play().catch(()=>{});}
function playMusic(){if(state.music)music.play().catch(()=>{});else music.pause();}
function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),3300);}
const completed=()=>state.done.filter(Boolean).length;
const nextLevel=()=>{const i=state.done.findIndex(x=>!x);return i<0?9:i;};
const unlocked=i=>i===0||state.done[i-1];
const eligible=i=>!state.upgrades.includes(upgrades[i].id)&&state.energy>=upgrades[i].cost&&(i===0||state.upgrades.includes(upgrades[i-1].id));
function header(back=false){return `<header>${back?'<button class="icon-btn" data-action="lab" aria-label="Лаборатория">‹</button>':'<div class="brand"><i class="mark"></i>АВРОРА</div>'}<div class="resources"><div class="pill">ϟ <b>${state.energy}</b></div><div class="pill">◌ <b>${completed()}/10</b></div><button class="icon-btn" data-action="settings" aria-label="Настройки">⚙</button></div></header>`;}
function lab(){const done=completed(),next=nextLevel();return `<div class="view-lab ${state.upgrades.includes('power')?'powered':''}">${header()}<div class="hero-copy"><div class="eyebrow">Станция 07 · Глубина 240 м</div><h1>Вернём океану<br><em>его свет.</em></h1><p>Шаг за шагом оживляйте забытую лабораторию. Каждая капля имеет значение.</p><div class="status-chips">${upgrades.map(u=>`<span class="${state.upgrades.includes(u.id)?'on':''}">${state.upgrades.includes(u.id)?'●':'○'} ${u.label}</span>`).join('')}</div></div><div class="lab-stage" data-spline-passthrough><img class="lab-picture" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Подводная лаборатория Аврора"><div class="lab-tag">${state.upgrades.length===3?'СТАНЦИЯ ВОССТАНОВЛЕНА':'ВОССТАНОВЛЕНО '+state.upgrades.length+' ИЗ 3 СИСТЕМ'}</div></div><section class="mission"><div class="copy"><div class="eyebrow">${done===10?'Экспедиция завершена':'Следующая проба · '+String(next+1).padStart(2,'0')}</div><h2>${done===10?'Океан снова живой':levels[next].name}</h2><p>${done===10?'Все 10 проб собраны. Завершите улучшения станции или переиграйте любимые уровни.':'Соберите чистые реагенты и получите заряд для лаборатории.'}</p></div><button class="button" data-action="${done===10?'map':'play'}">${done===10?'ВЫБРАТЬ УРОВЕНЬ':'НАЧАТЬ ПРОБУ &nbsp; →'}</button></section><nav class="nav"><button class="active" data-action="lab">⌂ &nbsp; Лаборатория</button><button data-action="map">◇ &nbsp; Экспедиция</button></nav><div class="upgrade-grid">${upgrades.map((u,i)=>{const done=state.upgrades.includes(u.id);return `<article class="upgrade ${done?'done':''}"><div class="symbol">${u.icon}</div><h3>${u.name}</h3><p>${u.desc}</p><button class="button ${eligible(i)?'':'secondary'}" data-upgrade="${i}" ${done?'disabled':''}>${done?'✓ ГОТОВО':eligible(i)?'ВОССТАНОВИТЬ · '+u.cost+' ϟ':(i>0&&!state.upgrades.includes(upgrades[i-1].id)?'СНАЧАЛА '+upgrades[i-1].label.toUpperCase():`НУЖНО ${u.cost} ϟ · ЕСТЬ ${state.energy}`)}</button></article>`;}).join('')}</div></div>`;}
function render(){renderer?.destroy();renderer=null;generation++;selected=-1;hint=[];
 if(scene==='lab')app.innerHTML=lab();
 if(scene==='game'){app.innerHTML=`<div class="view-game">${header(true)}<section class="game-wrap"><div class="game-title"><div class="eyebrow">Проба ${String(index+1).padStart(2,'0')} / 10</div><h1>${levels[index].name}</h1><p>${levels[index].text}</p></div><div class="game-meta"><span id="moves">ХОДОВ: ${moves}</span><div class="dots">${levels.map((_,i)=>`<i class="${i<=index?'filled':''}"></i>`).join('')}</div><span>+1 ϟ</span></div><div class="board-shell"><canvas id="board" aria-hidden="true"></canvas><div class="bottle-targets"></div></div><div class="game-tip" id="tip">Выберите колбу, затем — куда перелить</div><div class="tools"><button class="tool" data-action="undo" ${!history.length?'disabled':''}><b>↶</b>Отменить</button><button class="tool" data-action="hint"><b>✧</b>Подсказка</button><button class="tool" data-action="extra" ${extra?'disabled':''}><b>＋</b>Колба</button><button class="tool" data-action="restart"><b>↻</b>Заново</button></div><p class="game-tip">Соберите четыре слоя одного цвета в каждой колбе.</p></section></div>`;renderer=new BoardRenderer(document.querySelector('#board'),document.querySelector('.bottle-targets'),choose);renderer.update(board);}
 if(scene==='map')app.innerHTML=`<div class="view-game">${header(true)}<section class="map-screen"><div class="eyebrow">Первая экспедиция</div><h1>Путь к рассвету</h1><p>Десять проб. Три системы. Один океан, который ждёт.</p><div class="map-grid">${levels.map((l,i)=>`<button class="level-node ${state.done[i]?'done':''} ${i===nextLevel()?'current':''}" data-level="${i}" ${unlocked(i)?'':'disabled'}><b>${unlocked(i)?String(i+1).padStart(2,'0'):'⌑'}</b><small>${l.name}</small></button>`).join('')}</div><button class="button secondary" data-action="lab">В ЛАБОРАТОРИЮ</button></section></div>`;
 if(scene==='win'){const ready=upgrades.findIndex((_,i)=>eligible(i));app.innerHTML=`<div class="view-game">${header()}<section class="victory"><div class="seal">✧</div><div class="eyebrow">Проба ${index+1} очищена</div><h1>${index===9?'Аврора просыпается':'Ещё немного света'}</h1><p>Реагенты готовы. ${moves} ${moveWord(moves)} — и океан стал на шаг ближе.</p><div class="reward">${lastReward?'ϟ +1 заряд для лаборатории':'✓ Проба уже исследована'}</div>${ready>=0?`<p class="milestone">Доступно улучшение: ${upgrades[ready].name}</p>`:''}<div class="buttons"><button class="button" data-action="${ready>=0||index===9?'lab':'next'}">${ready>=0?'УЛУЧШИТЬ ЛАБОРАТОРИЮ':index===9?'ВЕРНУТЬСЯ НА СТАНЦИЮ':'СЛЕДУЮЩАЯ ПРОБА →'}</button><button class="button secondary" data-action="${ready>=0?'next':'lab'}">${ready>=0&&index<9?'Продолжить экспедицию':'В лабораторию'}</button></div></section></div>`;}
 if(modal)app.insertAdjacentHTML('beforeend',`<div class="settings"><section class="modal" role="dialog" aria-modal="true" aria-label="Настройки"><div class="eyebrow">Комфортное погружение</div><h2>Настройки</h2><label>Звуки<input type="checkbox" data-setting="sound" ${state.sound?'checked':''}></label><label>Музыка<input type="checkbox" data-setting="music" ${state.music?'checked':''}></label><label>Меньше анимации<input type="checkbox" data-setting="reduced" ${state.reduced?'checked':''}></label><button class="button" data-action="close">ПРОДОЛЖИТЬ</button></section></div>`);
 document.querySelectorAll('[data-action="hint"],[data-action="restart"],[data-action="extra"]').forEach(b=>{if(busy)b.disabled=true;});
 syncLab();
}
function refreshBoard(){renderer?.update(board,selected,hint);const m=document.querySelector('#moves');if(m)m.textContent=`ХОДОВ: ${moves}`;const tip=document.querySelector('#tip');if(tip)tip.textContent=hint.length?`Перелейте из колбы ${hint[0]+1} в колбу ${hint[1]+1}`:selected>=0?'Выберите пустую колбу или такой же верхний цвет':'Выберите колбу, затем — куда перелить';const undo=document.querySelector('[data-action="undo"]');if(undo)undo.disabled=!history.length||busy;}
function start(i){if(!unlocked(i)||busy)return;index=i;board=copy(levels[i].board);history=[];moves=0;selected=-1;hint=[];extra=false;scene='game';modal=false;render();playMusic();}
async function choose(i){if(busy||modal)return;hint=[];if(selected<0){if(board[i].length){selected=i;sound('select');}refreshBoard();return;}if(selected===i){selected=-1;refreshBoard();return;}const from=selected,next=pour(board,from,i);if(!next){sound('invalid');toast('Переливайте на такой же цвет или в пустую колбу');selected=board[i].length?i:-1;refreshBoard();return;}
 history.push({board:copy(board),moves,extra});busy=true;selected=-1;const token=generation;refreshBoard();document.querySelectorAll('button').forEach(b=>b.disabled=true);sound('pour');await renderer.animatePour(from,i,next,state.reduced);if(generation!==token){busy=false;return;}board=next;moves++;busy=false;hint=[];
 if(won(board)){lastReward=reward(state,index,moves);save();sound('win');scene='win';render();}else{document.querySelectorAll('button').forEach(b=>b.disabled=false);document.querySelector('[data-action="extra"]').disabled=extra;refreshBoard();}
}
async function requestHint(){if(busy)return;busy=true;toast('Ищу чистый путь…');const token=generation;await new Promise(r=>setTimeout(r,25));const path=solve(board,60000);busy=false;if(token!==generation)return;if(path?.length){hint=path[0];selected=-1;refreshBoard();}else toast('Попробуйте отменить ход или добавить колбу');}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled||busy)return;playMusic();if(b.dataset.level!==undefined){start(+b.dataset.level);return;}if(b.dataset.upgrade!==undefined){const i=+b.dataset.upgrade;if(buy(state,i)){save();sound('win');render();app.classList.add('upgrade-celebration');setTimeout(()=>app.classList.remove('upgrade-celebration'),1700);toast(upgrades[i].name+' — готово!');}else toast('Соберите заряды за новые пробы');return;}
 const a=b.dataset.action;if(a==='play')start(nextLevel());if(a==='next'){if(index<9)start(index+1);else{scene='lab';render();}}
 if(a==='lab'||a==='map'){scene=a;modal=false;render();}
 if(a==='restart')start(index);
 if(a==='settings'){modal=true;render();}if(a==='close'){modal=false;render();}
 if(a==='undo'&&history.length){const p=history.pop();board=p.board;moves=p.moves;extra=p.extra;selected=-1;hint=[];render();}
 if(a==='extra'&&!extra){history.push({board:copy(board),moves,extra});extra=true;board.push([]);selected=-1;hint=[];render();}
 if(a==='hint')requestHint();
});
app.addEventListener('change',e=>{const key=e.target.dataset.setting;if(key){state[key]=e.target.checked;save();playMusic();}});
window.addEventListener('blur',()=>music.pause());document.addEventListener('visibilitychange',()=>{if(document.hidden)music.pause();});
async function initSpline(){if(!isSpline)return;try{await spline.ready;const objs=await spline.getAllObjects();for(const o of objs){objectIds[o.name]=o.id;baseObjects[o.name]=o;}bridgeReady=true;syncLab();}catch(e){console.warn('Aurora scene bridge:',e);}}
function update(name,props){if(bridgeReady&&objectIds[name])spline.updateObject(objectIds[name],props).catch(()=>{});}
function syncLab(){if(!bridgeReady)return;const power=state.upgrades.includes('power');update('Upgrade Lights',{visible:power});update('Upgrade Garden',{visible:state.upgrades.includes('garden')});update('Upgrade Ocean',{visible:state.upgrades.includes('ocean')});update('Monitor Screen',{material:{color:power?'#5aa68b':'#234950'}});update('Power Status',{material:{color:power?'#ccec8e':'#c08c66'}});update('Ocean Window',{material:{color:state.upgrades.includes('ocean')?'#27667a':'#173e4c'}});
 // Fit the room to the central, unobstructed part of the viewport.
 const mobile=innerWidth<700,ratio=innerWidth/innerHeight,dist=mobile?Math.max(980,850/ratio):1050;
 const yaw=28*Math.PI/180,pitch=24*Math.PI/180;
 update('Aurora Camera',{position:{x:Math.sin(yaw)*Math.cos(pitch)*dist,y:100+Math.sin(pitch)*dist,z:Math.cos(yaw)*Math.cos(pitch)*dist}});
}
window.addEventListener('resize',syncLab);
render();initSpline();
